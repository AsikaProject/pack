name: ShellCheck

on:
  push:
    branches: [main]
    paths: ['scripts/*.sh']
  pull_request:
    branches: [main]
    paths: ['scripts/*.sh']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          for f in scripts/*.sh; do
            echo "=== Checking $f ==="
            shellcheck "$f" || exit 1
          done
