name: Inno Setup Test

on:
  push:
    branches: [main]
    paths: ['templates/inno/**', 'scripts/package-inno.sh', 'doc/**']
  pull_request:
    branches: [main]
    paths: ['templates/inno/**', 'scripts/package-inno.sh', 'doc/**']

jobs:
  inno-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress --limit-output
          # Refresh PATH for subsequent steps
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Write-Host "Inno Setup installed"

      - name: Create build directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path inno-build
          New-Item -ItemType Directory -Force -Path "inno-build/doc"
          Write-Host "Build directory created"

      - name: Create stub binaries
        shell: pwsh
        run: |
          New-Item -ItemType File -Force -Path "inno-build/asika.exe"
          New-Item -ItemType File -Force -Path "inno-build/asikad.exe"
          Write-Host "Stub binaries created"

      - name: Copy doc files
        shell: pwsh
        run: |
          Copy-Item "doc/*.html" "inno-build/doc/" -ErrorAction SilentlyContinue
          Copy-Item "doc/*.1" "inno-build/doc/" -ErrorAction SilentlyContinue
          Write-Host "Docs copied"

      - name: Copy Inno Setup templates
        shell: pwsh
        run: |
          Copy-Item "templates/inno/*" "inno-build/" -Recurse
          Copy-Item "LICENSE" "inno-build/" -Recurse
          Write-Host "Templates copied"

      - name: Replace version with sed (simulate package-inno.sh)
        shell: bash
        run: |
          cd inno-build
          sed -i "s/0.0.0.0/1.0.0.0/g" setup.iss
          echo "=== setup.iss (first 5 lines) ==="
          head -5 setup.iss

      - name: Run iscc (generate actual exe)
        shell: pwsh
        run: |
          # Refresh PATH to include Inno Setup
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Set-Location inno-build
          & iscc setup.iss
          if (-not (Test-Path "Output/Asika_Setup_*.exe")) {
            Write-Host "ERROR: No exe generated"
            Get-ChildItem .
            exit 1
          }
          Write-Host "SUCCESS: exe generated"
          Get-ChildItem "Asika_Setup_*.exe"
      - uses: actions/upload-artifact@v6
        with:
          name: setup
          path: Output/*.exe
