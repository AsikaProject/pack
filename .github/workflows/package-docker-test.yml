name: Package Docker Test

on:
  push:
    branches: [main]
    paths: ['scripts/package-docker.sh', 'Dockerfile', 'doc/**']
  pull_request:
    branches: [main]
    paths: ['scripts/package-docker.sh', 'Dockerfile', 'doc/**']

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax check
        run: bash -n scripts/package-docker.sh
      - name: Verify files
        run: |
          test -f scripts/package-docker.sh
          test -f Dockerfile
          test -d doc/
          echo "All Docker files present"

  docker-test:
    needs: syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup QEMU
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: Create stub binaries
        run: |
          touch asika asikad
          chmod +x asika asikad
      - name: Create mock go.mod (simulates main repo context)
        run: |
          echo "module github.com/AsikaProject/asika" > go.mod
          echo "require github.com/some/dependency v1.0.0" >> go.mod
          echo "github.com/some/dependency v1.0.0/go.mod h1:abc123" > go.sum
      - name: Test Docker build (no push)
        run: |
          docker buildx create --name testbuilder --driver docker-container --use 2>/dev/null || \
          docker buildx use testbuilder 2>/dev/null || true
          docker buildx build \
            --build-arg VERSION=dev \
            --platform linux/amd64 \
            --file Dockerfile \
            --load \
            .
        env:
          DOCKER_BUILDKIT: 1
      - name: Verify image built
        run: docker images | grep asika || echo "Image build test completed"
