name: Script Test

on:
  push:
    branches: [main]
    paths: ['scripts/*.sh', 'debian/**', 'Dockerfile', 'doc/**']
  pull_request:
    branches: [main]
    paths: ['scripts/*.sh', 'debian/**', 'Dockerfile', 'doc/**']

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax check all scripts
        run: |
          for f in scripts/*.sh; do
            echo "=== Syntax: $f ==="
            bash -n "$f" || exit 1
          done
      - name: Verify required files
        run: |
          test -f action.yml
          test -d debian/
          test -d doc/
          test -f Dockerfile
          echo "All required files present"

  debian-test:
    needs: syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create stub binaries
        run: |
          touch asika asikad
          chmod +x asika asikad
      - name: Test package-deb.sh (in Docker)
        run: |
          docker run --rm \
            -v $(pwd):/workspace \
            -w /workspace \
            debian:sid \
            bash -c "apt-get update && apt-get install -y debhelper-compat golang-go && \
                     dpkg-buildpackage -b -us -uc" 2>&1
      - name: Verify .deb files
        run: |
          ls -lh *.deb
          test -f asika_*.deb
          test -f asikad_*.deb
          echo "Debian packages created successfully"

  docker-test:
    needs: syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup QEMU
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: Create stub binaries
        run: |
          touch asika asikad
          chmod +x asika asikad
      - name: Test Docker build (no push)
        run: |
          docker buildx create --name testbuilder --driver docker-container --use 2>/dev/null || \
          docker buildx use testbuilder 2>/dev/null || true
          docker buildx build \
            --build-arg VERSION=dev \
            --platform linux/amd64 \
            --file Dockerfile \
            --load \
            .
        env:
          DOCKER_BUILDKIT: 1
      - name: Verify image built
        run: |
          docker images | grep asika || echo "Image build test completed"
